<!DOCTYPE html>
<html lang="pt-BR" data-bs-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Game</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="menu.css">
</head>

<body>
    <nav class="navbar barra">
        <div class="container">
            <span class="navbar-brand barra-logo">snake.js</span>
            <span class="navbar-text">Recorde: <strong class="destaque" id="recorde-barra">0</strong></span>
        </div>
    </nav>

    <main class="container py-5">
        <div class="row justify-content-center">
            <div class="col-12 col-sm-10 col-md-7 col-lg-5 d-flex flex-column gap-3">
                <section class="text-center">
                    <h1 class="letreiro">SNAKE</h1>
                    <p class="text-secondary mb-0">Coma, cresça e não bata em nada.</p>
                </section>

                <section class="card painel">
                    <div class="card-body d-flex justify-content-between align-items-center">
                        <span class="painel-rotulo">Maior pontuação</span>
                        <span class="painel-numero" id="recorde-painel">0</span>
                    </div>
                </section>

                <form class="card painel" id="form-partida" action="partida.html">
                    <div class="card-body">
                        <p class="painel-rotulo mb-2">Velocidade</p>

                        <div class="btn-group w-100" role="group">
                            <input type="radio" class="btn-check" name="nivel" id="nivel-lenta" value="180">
                            <label class="btn btn-nivel" for="nivel-lenta">Lenta</label>

                            <input type="radio" class="btn-check" name="nivel" id="nivel-normal" value="120" checked>
                            <label class="btn btn-nivel" for="nivel-normal">Normal</label>

                            <input type="radio" class="btn-check" name="nivel" id="nivel-rapida" value="75">
                            <label class="btn btn-nivel" for="nivel-rapida">Rápida</label>
                        </div>

                        <button type="submit" class="btn botao-comecar w-100 mt-3">Começar</button>
                    </div>
                </form>

                <section class="card painel">
                    <div class="card-body">
                        <p class="painel-rotulo mb-3">Regras</p>
                        <ul class="list-unstyled regras d-flex flex-column gap-2 mb-0">
                            <li><kbd>Setas</kbd> ou <kbd>WASD</kbd> movem a cobra</li>
                            <li>Cada fruta vale <b>10 pontos</b></li>
                            <li>Encostar na borda encerra a partida</li>
                            <li>Encostar no próprio corpo também</li>
                        </ul>
                    </div>
                </section>
            </div>
        </div>
    </main>

    <script src="menu.js"></script>
</body>

</html>
